# Cut a release from a tag:
#
#     git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# Each platform gets one self-contained binary. There is nothing to
# unpack: the receivers, their pages, the offline basemap and Leaflet are
# all compiled in.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are annotated and their message is used as the release
          # notes below, so the tag object itself has to come along.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A release that does not pass its own tests is not worth cutting.
      - name: Test
        run: go test ./...

      - name: Build every platform
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          ldflags="-s -w -X github.com/thatSFguy/swDefinedRadio/internal/cli.Version=${version}"
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            out="dist/sdr-${version}-${os}-${arch}"
            # Not "[ ... ] && out=...": these steps run under bash -e, so
            # the test failing for every non-Windows target would end the
            # step with it.
            if [ "$os" = windows ]; then
              out="${out}.exe"
            fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/sdr
            echo "  built $out"
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What changed comes from the tag's own message, so a release
          # says something specific rather than repeating the same
          # standing description every time. What it is and how to
          # install it follows, since that is true of every release.
          #
          # The checkout leaves tags as lightweight refs, and asking one
          # of those for its contents quietly hands back the *commit*
          # message instead — which looks plausible and is wrong. Fetch
          # the real tag objects, then refuse to guess if the tag turns
          # out not to be annotated after all.
          git fetch --force --tags --quiet
          if ! git rev-parse --quiet --verify "${GITHUB_REF_NAME}^{tag}" > /dev/null; then
            echo "::error::${GITHUB_REF_NAME} is not an annotated tag; release notes would be a commit message. Tag with -a."
            exit 1
          fi
          {
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo
            echo '---'
            echo
            cat .github/release-notes.md
          } > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md
